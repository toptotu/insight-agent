{% extends "base.html" %}

{% block content %}
<section class="panel">
  <h2>快速洞察</h2>
  <p class="meta">输入给大模型的提示词，生成HTML洞察报告并保存。</p>
  <label>
    提示词（给大模型的指令）
    <textarea id="quickPromptText" rows="8" placeholder="例如：洞察6g技术输出ppt格式html"></textarea>
  </label>
  <div class="actions">
    <button id="quickRunBtn" class="button primary">生成洞察报告</button>
  </div>
</section>

<section class="panel">
  <h3>生成结果</h3>
  <div id="quickResultMeta" class="meta"></div>
  <div id="quickResultSummary" class="output"></div>
</section>
{% endblock %}
