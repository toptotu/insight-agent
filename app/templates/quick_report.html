{% extends "base.html" %}

{% block content %}
<section class="panel">
  <h2>快速洞察报告</h2>
  <div class="actions">
    <button id="quickEditToggle" class="button">编辑报告内容</button>
  </div>
  <div id="quickEditPanel" class="output" style="display:none;">
    <div class="form-grid">
      <label>
        标题
        <input id="quickEditTitle" type="text" />
      </label>
      <label>
        目标
        <input id="quickEditObjective" type="text" />
      </label>
    </div>
    <label>
      提示词（只读）
      <textarea id="quickEditPrompt" rows="4" readonly></textarea>
    </label>
    <label>
      报告HTML内容
      <textarea id="quickEditHtml" rows="12"></textarea>
    </label>
    <div class="actions">
      <button id="quickEditSave" class="button primary">保存修改</button>
    </div>
  </div>
</section>
<iframe id="quickHtmlFrame" class="quick-frame"></iframe>
{% endblock %}

{% block scripts %}
<script>
  window.__QUICK_REPORT_ID__ = "{{ report_id }}";
</script>
{% endblock %}
