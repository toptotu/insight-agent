{% extends "base.html" %}

{% block content %}
<section class="ppt">
  <div class="slide" id="slideCover">
    <div class="slide-header">
      <h2>洞察报告</h2>
      <p class="meta">任务ID：{{ task_id }}</p>
    </div>
    <div class="slide-content">
      <div id="reportMeta" class="meta"></div>
      <div id="reportObjective" class="cover-title"></div>
      <div id="reportDate" class="meta"></div>
    </div>
  </div>

  <div class="slide" id="slideSummary">
    <div class="slide-header">
      <h3>洞察摘要</h3>
    </div>
    <div class="slide-content">
      <div id="reportSummaryCards" class="card-grid"></div>
      <div id="reportSummary" class="output"></div>
      <div id="reportOutline" class="output"></div>
    </div>
  </div>

  <div class="slide" id="slideViewpoints">
    <div class="slide-header">
      <h3>关键观点与热点</h3>
    </div>
    <div class="slide-content">
      <div id="reportViewpoints" class="tag-grid"></div>
      <div id="reportComparison" class="output"></div>
      <div id="reportTrendInsight" class="output"></div>
    </div>
  </div>

  <div class="slide" id="slideCapabilities">
    <div class="slide-header">
      <h3>能力识别与验证</h3>
    </div>
    <div class="slide-content">
      <canvas id="reportCapabilityChart" class="chart-canvas"></canvas>
      <div id="reportCapabilities" class="output"></div>
      <div id="reportCustomSkills" class="output"></div>
      <div id="reportVerificationPlan" class="output"></div>
    </div>
  </div>

  <div class="slide" id="slideEvidence">
    <div class="slide-header">
      <h3>证据链与Agent分析</h3>
    </div>
    <div class="slide-content">
      <div class="chart-grid">
        <canvas id="reportEvidenceChart" class="chart-canvas"></canvas>
        <canvas id="reportSourceChart" class="chart-canvas"></canvas>
      </div>
      <div id="reportAgents" class="output"></div>
      <div id="reportEvidence" class="output"></div>
      <div id="reportSourceCollection" class="output"></div>
    </div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
  window.__REPORT_TASK_ID__ = "{{ task_id }}";
</script>
{% endblock %}
